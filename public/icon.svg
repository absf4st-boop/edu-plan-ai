<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Graduation Cap / Mortarboard -->
  <path d="M 256 120 L 380 185 L 256 248 L 132 185 Z" fill="url(#primaryGrad)" filter="url(#glow)" />
  <path d="M 256 130 L 360 185 L 256 238 L 152 185 Z" fill="#ffffff" opacity="0.3" />
  
  <!-- Tassel -->
  <path d="M 350 195 L 350 250 C 350 260 365 260 365 250 L 365 195 Z" fill="url(#goldGrad)" />
  <circle cx="357" cy="254" r="7" fill="url(#goldGrad)" />

  <!-- Open Book Base -->
  <path d="M 140 280 Q 256 300 256 380 Q 256 300 372 280 L 372 370 Q 256 390 256 420 Q 256 390 140 370 Z" fill="#ffffff" opacity="0.95" />
  <path d="M 145 288 Q 256 308 256 380 Q 256 308 367 288 L 367 362 Q 256 382 256 412 Q 256 382 145 362 Z" fill="#f8fafc" />

  <!-- Book Spine Center Divider -->
  <path d="M 256 295 L 256 418" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />

  <!-- AI Sparkles -->
  <path d="M 256 170 Q 256 182 268 182 Q 256 182 256 194 Q 256 182 244 182 Q 256 182 256 170 Z" fill="url(#goldGrad)" />
  <path d="M 380 130 Q 380 145 395 145 Q 380 145 380 160 Q 380 145 365 145 Q 380 145 380 130 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <path d="M 130 140 Q 130 150 140 150 Q 130 150 130 160 Q 130 150 120 150 Q 130 150 130 140 Z" fill="url(#goldGrad)" />

  <!-- Subtitle Text -->
  <text x="256" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="3">EDU PLAN AI</text>
</svg>
